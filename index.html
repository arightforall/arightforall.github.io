<noscript><style>.fade{opacity:1!important;animation:none!important}</style></noscript>
<style>
  :root{
    --room:#0E1F1E;
    --mast:#EFEFEA;
    --stock:#DAE3EA;
    --stock-2:#8D9CAD;
    --sky:#86B6EC;
    --jade:#7FC6B0;
    --warn:#DF8E82;
    --serif:'Charter','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  html{
    color-scheme:dark;
    background-color:var(--room);
    font-size:106.25%;
    -webkit-text-size-adjust:100%;
    min-height:100%;
    overflow-x:hidden;
    overscroll-behavior-y:none;
  }
  body{
    background-color:var(--room);
    color:var(--stock);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }
  @supports (overflow:clip){body{overflow-x:clip}}

  /* ── 1:1 physical-pixel canvas ground painted at native devicePixelRatio.
     Zero lossy compression, zero upscaling moire, zero 8-bit contour rings. */
  #roomCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    display:block;
  }

  main{
    position:relative;z-index:2;flex:1 0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;width:100%;min-height:100vh;min-height:100svh;
    padding:clamp(1.75rem,5vh,3.4rem) clamp(1.35rem,6vw,4rem);
    transition:opacity .36s var(--ease);
  }
  html.is-leaving main{opacity:0}

  .centerpiece{
    width:100%;
    max-width:46rem;
    margin-block:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    /* Subtle classical optical lift (~3% above strict geometric midline, matching the lamp) */
    padding-bottom:clamp(.8rem,3.4vh,2.4rem);
  }

  /* ── Wordmark: exact v51 A Right for All small-caps with raking oklab light */
  .name{
    font-variant-caps:small-caps;
    letter-spacing:.22em;
    text-indent:.22em;
    font-weight:700;
    font-size:clamp(1.6rem,5vw,3.2rem);
    line-height:1.12;
    max-width:100%;
    color:var(--mast);
  }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .name{
      background-image:linear-gradient(180deg,#FDF6EC 10%,var(--mast) 60%,#DFE9E7 96%);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;color:transparent;
    }
    @supports (background:linear-gradient(in oklab,red,blue)){
      .name{background-image:linear-gradient(in oklab 180deg,#FDF6EC 10%,var(--mast) 60%,#DFE9E7 96%)}
    }
  }

  /* ── Reused directly from v51 — one crisp signal-rule primitive at every width.
     No sub-pixel SVG scaling; zero horizontal stair-steps at 1x, 2x, or 3x. */
  .signal-rule{
    position:relative;
    display:block;
    height:7px;
    flex:none;
    isolation:isolate;
  }
  .signal-rule::before{
    content:"";
    position:absolute;
    left:0;right:0;top:3px;height:1px;
    background:linear-gradient(90deg,transparent 0%,currentColor 14%,currentColor 86%,transparent 100%);
    opacity:.32;
  }
  .signal-rule::after{
    content:"";
    position:absolute;
    left:50%;top:2px;width:30%;height:3px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center,
      var(--rule-peak,rgba(255,253,247,.96)) 0%,
      currentColor 20%,
      currentColor 34%,
      transparent 72%);
    opacity:.68;
  }
  .swell-rule{
    width:min(82vw,46rem);
    color:var(--mast);
    margin-top:clamp(1.1rem,2.3vh,1.5rem);
  }

  /* ── Pure direct passcode threshold: balanced editorial scale, dynamic 2-letter-space arrow */
  .gate-form{
    --field-size:clamp(1.24rem,2.2vw,1.38rem);
    width:min(100%,22.5rem);
    margin-top:clamp(2.25rem,5vh,3.15rem);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .field-row{
    position:relative;
    width:100%;
    padding:0 0 .12rem;
    display:flex;
    align-items:center;
    justify-content:center;
    --arrow-x:84px;
    --reveal-x:-92px;
  }
  .measure-probe{
    position:absolute;
    top:0;
    left:0;
    visibility:hidden;
    pointer-events:none;
    white-space:pre;
    font-family:var(--serif);
    font-size:var(--field-size);
    line-height:1.25;
  }
  .gate-input{
    position:relative;
    z-index:1;
    width:100%;
    min-width:0;
    min-height:2.75rem;
    border:0;
    background:transparent;
    color:var(--mast);
    font-family:var(--serif);
    font-size:var(--field-size);
    line-height:1.25;
    letter-spacing:.14em;
    text-indent:.14em;
    text-align:center;
    padding:.32rem 3.35rem .36rem;
    caret-color:var(--sky);
  }
  .gate-input[type="text"]{
    letter-spacing:.04em;
    text-indent:.04em;
  }
  .field-row.is-dots .gate-input{
    transform:translateY(3px);
  }
  .gate-input::placeholder{
    color:rgba(218,227,234,.66);
    font-style:italic;
    letter-spacing:.04em;
    text-indent:.04em;
    opacity:1;
    transition:color .22s ease;
  }
  .gate-input:focus::placeholder{color:rgba(218,227,234,.42)}
  .gate-input:focus{outline:0}
  .gate-input::selection{background:rgba(134,182,236,.24);color:var(--mast)}
  .gate-input:-webkit-autofill,
  .gate-input:-webkit-autofill:hover,
  .gate-input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--mast);
    caret-color:var(--sky);
    transition:background-color 0s 600000s,color 0s 600000s;
  }

  /* Left slot: typographic show/hide word — mirrors the arrow symmetrically once typing begins */
  .gate-reveal{
    position:absolute;
    z-index:2;
    left:50%;
    top:50%;
    width:2.75rem;
    height:2.75rem;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:0;
    background:none;
    color:var(--stock);
    font-family:var(--serif);
    font-size:.94rem;
    font-style:italic;
    padding:0;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform:translate(calc(-50% + var(--reveal-x)), calc(-50% + 1.5px));
    transition:opacity .22s ease,color .18s ease,transform .24s var(--ease);
  }
  .field-row.has-value .gate-reveal{opacity:.66;pointer-events:auto}
  .gate-reveal:hover,.gate-reveal:focus-visible{opacity:1!important;color:var(--mast)}
  .gate-reveal:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:2px}

  /* Right slot: bespoke calligraphic serif-matched arrow, 2 letter spaces from passcode, gliding smoothly for long codes.
     Group opacity sits on the SVG (not stroke alpha) so shaft + barbs composite with 100% uniform luminosity. */
  .gate-submit{
    position:absolute;
    z-index:2;
    left:50%;
    top:50%;
    width:2.75rem;
    height:2.75rem;
    display:grid;
    place-items:center;
    border:0;
    background:none;
    color:var(--stock);
    cursor:pointer;
    transform:translate(calc(-50% + var(--arrow-x)), calc(-50% + 1px));
    transition:color .2s ease,transform .24s var(--ease);
  }
  .gate-submit svg{
    display:block;
    width:20px;
    height:15px;
    overflow:visible;
    opacity:.64;
    transition:transform .22s var(--ease),opacity .2s ease;
  }
  .field-row.has-value .gate-submit svg,.field-row:focus-within .gate-submit svg{opacity:.92}
  .gate-submit:hover{color:var(--mast)}
  .gate-submit:hover svg{opacity:1;transform:translateX(2.5px)}
  .gate-submit:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:2px;color:var(--mast)}
  .gate-submit:focus-visible svg{opacity:1}
  .gate-submit:disabled{cursor:wait}
  .gate-submit:disabled svg{opacity:.42;transform:none}

  /* Matching miniature v51 signal-rule under the passcode field (zero SVG stair-steps) */
  .field-rule-wrap{
    position:absolute;
    z-index:1;
    left:50%;
    bottom:-1px;
    width:min(100%,20.5rem);
    height:7px;
    transform:translateX(-50%);
    pointer-events:none;
  }
  .field-rule{
    position:absolute;inset:0;width:100%;
    transition:opacity .32s var(--ease);
  }
  .field-rule::before{opacity:.28}
  .field-rule::after{width:40%;opacity:.56}
  .field-rule-rest{color:var(--mast);--rule-peak:rgba(255,253,247,.9)}
  .field-rule-focus{color:var(--sky);--rule-peak:rgba(235,245,255,.96);opacity:0}
  .field-rule-focus::before{opacity:.48}
  .field-rule-focus::after{width:46%;opacity:.82}
  .field-rule-error{color:var(--warn);--rule-peak:rgba(248,214,208,.96);opacity:0}
  .field-rule-error::before{opacity:.52}
  .field-rule-error::after{width:46%;opacity:.84}
  .field-rule-ok{color:var(--jade);--rule-peak:rgba(232,250,244,.96);opacity:0}
  .field-rule-ok::before{opacity:.54}
  .field-rule-ok::after{width:48%;opacity:.88}
  .field-row:hover .field-rule-rest{opacity:.94}
  .field-row:focus-within .field-rule-focus,
  .field-row.has-value .field-rule-focus{opacity:1}
  .field-row.is-error .field-rule-focus{opacity:0}
  .field-row.is-error .field-rule-error{opacity:1}
  .field-row.is-unlocked .field-rule-focus{opacity:0}
  .field-row.is-unlocked .field-rule-ok{opacity:1}

  @media (prefers-reduced-motion:no-preference){
    .field-row.is-shaking{animation:latchResist .3s cubic-bezier(.36,.07,.19,.97)}
    @keyframes latchResist{
      0%,100%{transform:translateX(0)}
      24%{transform:translateX(-4px)}
      50%{transform:translateX(3.5px)}
      76%{transform:translateX(-2px)}
    }
  }

  /* ── Quiet subordinate contact line nested directly under the passcode threshold */
  .foot-contact{
    position:relative;
    margin-top:clamp(1.25rem,2.6vh,1.65rem);
    border:0;
    background:none;
    color:rgba(218,227,234,.5);
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(.86rem,1.35vw,.95rem);
    letter-spacing:.025em;
    text-indent:.025em;
    line-height:1.4;
    padding:.25rem .45rem;
    cursor:pointer;
    transition:color .18s ease,opacity .18s ease;
  }
  .foot-contact::after{
    content:"";
    position:absolute;left:50%;bottom:.16rem;width:calc(100% - .9rem);height:1px;
    transform:translateX(-50%) scaleX(.55);transform-origin:center;
    background:linear-gradient(90deg,transparent,rgba(218,227,234,.55),transparent);
    opacity:0;transition:opacity .2s ease,transform .24s var(--ease);
  }
  .foot-contact:hover,.foot-contact:focus-visible{color:var(--stock)}
  .foot-contact:hover::after,.foot-contact:focus-visible::after{opacity:.75;transform:translateX(-50%) scaleX(1)}
  .foot-contact:focus-visible{outline:2px solid var(--sky);outline-offset:4px;border-radius:2px}
  .foot-contact.done{color:var(--jade)}
  .foot-contact.done::after{opacity:0}

  .gate-status{
    min-height:1.4rem;
    margin-top:.72rem;
    color:var(--stock-2);
    font-style:italic;
    font-size:.9rem;
    letter-spacing:.015em;
    line-height:1.4;
    text-wrap:pretty;
    transition:color .2s ease;
  }
  .gate-status.is-error{color:var(--warn)}

  .sr-only{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important;
  }
  .nojs-note{
    margin-top:2rem;color:var(--stock-2);font-style:italic;font-size:1rem;line-height:1.5;
  }

  /* ── Continuous v51 illumination entrance (zero flicker, opacity-only) */
  @media (prefers-reduced-motion:no-preference){
    html.intro-active .fade{opacity:0}
    html.intro-active.ready [data-intro="title"]{
      animation:introIlluminate 1050ms cubic-bezier(.2,.65,.3,1) 100ms forwards,
        introHalo 1050ms ease-in-out 100ms forwards;
    }
    html.intro-active.ready [data-intro="rule"]{
      animation:introFade 500ms ease-out 560ms forwards;
    }
    html.intro-active.ready [data-intro="gate"]{
      animation:introFade 520ms ease-out 860ms forwards;
    }
    html.intro-active.ready [data-intro="foot"]{
      animation:introFade 520ms ease-out 1080ms forwards;
    }
    @keyframes introIlluminate{from{opacity:0}to{opacity:1}}
    @keyframes introHalo{
      0%,100%{text-shadow:0 0 .28em rgba(239,239,234,0)}
      42%{text-shadow:0 0 .28em rgba(239,239,234,.12)}
    }
    @keyframes introFade{to{opacity:1}}
  }

  @media (max-width:35rem){
    .name{letter-spacing:.14em;text-indent:.14em}
    .centerpiece{padding-bottom:clamp(1rem,4vh,2rem)}
    .gate-form{width:min(100%,20.5rem);margin-top:clamp(1.9rem,4.6vh,2.7rem)}
    .gate-input{padding:.32rem 2.95rem .36rem}
    .field-rule-wrap{width:min(100%,18.5rem)}
  }
  @media (max-height:28rem){
    main{padding:.9rem clamp(1.2rem,5vw,2.5rem)}
    .centerpiece{padding-bottom:0}
    .swell-rule{margin-top:.8rem}
    .gate-form{margin-top:1.35rem}
    .foot-contact{margin-top:.9rem}
    .gate-status{margin-top:.45rem;min-height:1.15rem}
  }
  @media (prefers-reduced-motion:reduce){
    .gate-reveal,.gate-submit,.gate-submit svg,.field-rule,.foot-contact,main{transition:none}
  }
  @media (forced-colors:active){
    #roomCanvas{display:none}
    .name{background-image:none!important;-webkit-text-fill-color:CanvasText!important;color:CanvasText!important}
    .field-rule-wrap{display:none}
    .field-row{border-bottom:1px solid FieldText}
    .gate-input{color:FieldText!important;-webkit-text-fill-color:FieldText!important}
  }
</style>
</head>
<body>
<canvas id="roomCanvas" aria-hidden="true"></canvas>
<main>
  <div class="centerpiece">
    <h1 class="name fade" data-intro="title">A Right for All</h1>

    <span class="signal-rule swell-rule fade" data-intro="rule" aria-hidden="true"></span>

    <form class="gate-form fade" data-intro="gate" id="gateForm" autocomplete="off" novalidate>
      <div class="field-row" id="fieldRow">
        <span class="measure-probe" id="measureProbe" aria-hidden="true"></span>
        <button class="gate-reveal" id="revealBtn" type="button" aria-pressed="false" tabindex="-1">show</button>
        <label class="sr-only" for="passInput">Passcode</label>
        <input class="gate-input" id="passInput" name="passcode" type="password"
          placeholder="passcode" autocomplete="off" autocapitalize="none" spellcheck="false"
          aria-describedby="gateStatus">
        <button class="gate-submit" id="submitBtn" type="submit" aria-label="Unlock">
          <svg viewBox="0 0 20 15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 7.5H17.8"/>
            <path d="M13.3 2.8L18.2 7.5L13.3 12.2"/>
          </svg>
        </button>

        <div class="field-rule-wrap" aria-hidden="true">
          <span class="signal-rule field-rule field-rule-rest"></span>
          <span class="signal-rule field-rule field-rule-focus"></span>
          <span class="signal-rule field-rule field-rule-error"></span>
          <span class="signal-rule field-rule field-rule-ok"></span>
        </div>
      </div>
    </form>

    <button type="button" class="foot-contact fade" data-intro="foot" id="copyEmail" aria-describedby="copyLive" title="Copy email address">support@arightforall.com</button>
    <span class="sr-only" id="copyLive" role="status" aria-live="polite" aria-atomic="true"></span>
    <p class="gate-status" id="gateStatus" role="status" aria-live="polite" aria-atomic="true"></p>

    <noscript>
      <style>.gate-form{display:none}</style>
      <p class="nojs-note">Enable JavaScript to enter a passcode.</p>
    </noscript>
  </div>
</main>

<script>
// ── 1:1 physical-pixel C-infinity OKLab Oxidized Peacock room renderer.
// Renders directly at native devicePixelRatio with separable Gaussian light and
// independent per-channel triangular-PDF dithering (+-0.85 LSB): zero 8-bit rings,
// zero lossy compression artifacts, zero bilinear upscaling moire.
(function(){
  var canvas = document.getElementById('roomCanvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) return;

  function s2l(c){ return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function l2s(c){ c = c < 0 ? 0 : c > 1 ? 1 : c; return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
  function rgb2lab(r, g, b){
    r = s2l(r / 255); g = s2l(g / 255); b = s2l(b / 255);
    var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    var m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    var s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
    ];
  }
  // Precompute 257-step exact OKLab ramp from deep corner (#0B1918) to lamp (#152C27)
  var cDeep = rgb2lab(11, 25, 24), cLamp = rgb2lab(21, 44, 39);
  var LUT = 256;
  var lutR = new Float32Array(LUT + 1), lutG = new Float32Array(LUT + 1), lutB = new Float32Array(LUT + 1);
  for (var k = 0; k <= LUT; k++) {
    var t = k / LUT;
    var L = cDeep[0] + (cLamp[0] - cDeep[0]) * t;
    var A = cDeep[1] + (cLamp[1] - cDeep[1]) * t;
    var B = cDeep[2] + (cLamp[2] - cDeep[2]) * t;
    var l_ = L + 0.3963377774 * A + 0.2158037573 * B;
    var m_ = L - 0.1055613458 * A - 0.0638541728 * B;
    var s_ = L - 0.0894841775 * A - 1.2914855480 * B;
    var l3 = l_ * l_ * l_, m3 = m_ * m_ * m_, s3 = s_ * s_ * s_;
    lutR[k] = l2s(+4.0767416621 * l3 - 3.3077115913 * m3 + 0.2309699292 * s3) * 255;
    lutG[k] = l2s(-1.2684380046 * l3 + 2.6097574011 * m3 - 0.3413193965 * s3) * 255;
    lutB[k] = l2s(-0.0041960863 * l3 - 0.7034186147 * m3 + 1.7076147010 * s3) * 255;
  }

  function paint(){
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var cssW = canvas.clientWidth || window.innerWidth;
    var cssH = canvas.clientHeight || window.innerHeight;
    var w = Math.max(1, Math.round(cssW * dpr));
    var h = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width === w && canvas.height === h) return;
    canvas.width = w;
    canvas.height = h;
    var img = ctx.createImageData(w, h);
    var data = img.data;

    // Separable 1D Gaussian factors for lamp (57%, 40%) and warm bone breath (54%, 42%)
    var exX = new Float32Array(w), exY = new Float32Array(h);
    var bwX = new Float32Array(w), bwY = new Float32Array(h);

  // ── Exact typographic spacing engine: places the arrow precisely two letter spaces
  // right of "passcode" at rest, and glides symmetrically outward when typing longer codes.
  function measureInk(text, italic, letterSpacingEm){
    if (!probe) return 0;
    probe.style.fontStyle = italic ? 'italic' : 'normal';
    probe.style.letterSpacing = letterSpacingEm + 'em';
    probe.textContent = text;
    var w = probe.getBoundingClientRect().width;
    var fs = parseFloat(getComputedStyle(probe).fontSize) || 22;
    return Math.max(0, w - letterSpacingEm * fs);
  }
  function syncGeometry(){
    if (!row || !probe) return;
    var rowW = row.getBoundingClientRect().width;
    if (!rowW) return;
    var phW = measureInk('passcode', true, 0.04);
    var twoLetters = measureInk('oo', true, 0.04);
    var valW = 0;
    if (input.value.length > 0) {

        valW = measureInk(input.value, false, 0.04);
      } else {
        valW = measureInk('•'.repeat(input.value.length), false, 0.14);
      }
    }
    var contentHalf = Math.max(phW / 2, valW / 2);
    var maxHalf = Math.max(76, rowW / 2 - 22);
    // Arrow SVG is 20px wide with horizontal shaft starting at x=1px (-9px from center)
    var arrowX = Math.min(maxHalf, contentHalf + twoLetters + 9);

    var revealX = -Math.min(maxHalf, contentHalf + twoLetters + 17);

    }
    try {
      if (!window.crypto || !window.crypto.subtle) throw new Error('NO_SUBTLE');
      var enc = new TextEncoder();
      var baseKey = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
      var aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      var plainBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBytes(PAYLOAD.iv) },
        aesKey,
        b64ToBytes(PAYLOAD.ct)
      );
      return new TextDecoder().decode(plainBuf);
    } catch (err) {
      throw err;
    }
  }
  function stripTagBlock(src, marker, endTag, replacement){
    var i = src.indexOf(marker);
    if (i === -1) return src;
    var j = src.indexOf(endTag, i);
    if (j === -1) return src;
    return src.slice(0, i) + replacement + src.slice(j + endTag.length);
  }
  function upgradeUnlockedRules(html){
    if (html.indexOf('class="swell-svg"') === -1) return html;
    var css = '.signal-rule{position:relative;display:block;height:7px;flex:none;isolation:isolate}'
      + '.signal-rule::before{content:"";position:absolute;left:0;right:0;top:3px;height:1px;background:linear-gradient(90deg,transparent 0%,currentColor 14%,currentColor 86%,transparent 100%);opacity:.32}'
      + '.signal-rule::after{content:"";position:absolute;left:50%;top:2px;width:30%;height:3px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(255,253,247,.96) 0%,currentColor 20%,currentColor 34%,transparent 72%);opacity:.68}'
      + '.swell-rule{width:min(82vw,46rem);color:var(--mast);margin-top:clamp(1.1rem,2.3vh,1.5rem)}'
      + '.mini-rule{width:min(82vw,18rem);color:var(--mast);margin-top:clamp(.9rem,1.9vh,1.15rem)}'
      + '.mini-rule::before{opacity:.28}.mini-rule::after{width:40%;opacity:.56}';
    var out = html.replace('</style>', css + '</style>');
    out = stripTagBlock(out, '<svg class="swell-svg"', '</svg>', '<span class="signal-rule swell-rule" aria-hidden="true"></span>');
    out = stripTagBlock(out, '<svg class="mini-swell"', '</svg>', '<span class="signal-rule mini-rule" aria-hidden="true"></span>');
    return out;
  }
  function renderUnlocked(html){
    document.open('text/html', 'replace');
    document.write(upgradeUnlockedRules(html));
    document.close();
  }

  async function tryPasscode(code, silent){
    if (busy) return;
    busy = true;
    btn.disabled = true;
    input.readOnly = true;
    if (!silent) setStatus('checking…', false);
    try {
      var html = await decryptV51(code);
      try { sessionStorage.setItem(SESSION_KEY, code); } catch (_) {}
      if (silent || reducedMotion) {
        renderUnlocked(html);
        return;
      }
      row.classList.add('is-unlocked');
      setStatus('', false);
      setTimeout(function(){ root.classList.add('is-leaving'); }, 140);
      setTimeout(function(){ renderUnlocked(html); }, 440);
    } catch (err) {
      busy = false;
      btn.disabled = false;
      input.readOnly = false;
      if (err && err.message === 'NO_SUBTLE') {
        setStatus('Open over HTTPS to unlock.', true);
        return;
      }
      if (!silent) {
        failCount++;
        var waitMs = Math.min(1800, (failCount - 1) * 350);
        setTimeout(function(){
          setStatus('That passcode didn’t match.', true);
          if (!reducedMotion) {
            row.classList.remove('is-shaking');
            void row.offsetWidth;
            row.classList.add('is-shaking');
          }
          input.select();
          input.focus();
        }, waitMs);
      } else {
        try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
      }
    }
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var code = input.value;
    if (!code) {
      setStatus('Enter the passcode.', true);
      input.focus();
      return;
    }
    tryPasscode(code, false);
  });

  // Keep initial arrival pure (no blinking cursor cutting through "passcode"),
  // while letting desktop users begin typing immediately from anywhere on the page.
  window.addEventListener('keydown', function(e){
    if (busy || document.activeElement === input) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key && e.key.length === 1 && (!document.activeElement || document.activeElement === document.body)) {
      try { input.focus({ preventScroll: true }); } catch (_) {}
    }
  });

  (function(){
    var copyBtn = document.getElementById('copyEmail');
    var live = document.getElementById('copyLive');
    if (!copyBtn) return;
    var email = 'support@arightforall.com';
    var timer = 0;
    copyBtn.addEventListener('click', function(){
      clearTimeout(timer);
      function showCopied(){
        copyBtn.textContent = 'copied — ' + email;
        copyBtn.classList.add('done');
        if (live) live.textContent = 'Email address copied.';
        timer = setTimeout(function(){
          copyBtn.textContent = email;
          copyBtn.classList.remove('done');
        }, 1800);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(showCopied, function(){
          location.href = 'mailto:' + email;
        });
      } else {
        location.href = 'mailto:' + email;
      }
    });
  })();

  try {
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) tryPasscode(saved, true);
  } catch (_) {}
})();
</script>
